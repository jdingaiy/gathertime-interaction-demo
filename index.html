<html lang="zh-CN">

  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
  <style>
    :root { --paper: #ffffff; --ink: #171717; --inner: #9a9a96; --outer-line: 2px; --inner-line: 4px; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #fff; cursor: default; }
    #scene { position: relative; width: 100vw; height: 100vh; overflow: hidden; isolation: isolate; opacity: 1; cursor: grab; touch-action: none; }
    #scene.panning { cursor: grabbing; }
    .thing { position: absolute; left: 0; top: 0; transform-origin: center; user-select: none; touch-action: none; pointer-events: none; will-change: transform,opacity; z-index: 2; }
    .thing.detail-return-fade { transition: opacity .48s ease; }
    .thing.detail-return-hidden { opacity: 0; }
    .thing.object { width: 170px; height: 170px; }
    .thing.photo { border-radius: 3px; }
    .object .asset-state { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; filter: drop-shadow(0 5px 5px rgba(25,25,25,.08)); transition: opacity .1s ease; }
    .object .asset-hover, .object .asset-original { opacity: 0; }
    .object.is-hovered .asset-outline { opacity: 0; }
    .object.is-hovered .asset-hover { opacity: 1; }
    .object.is-selected .asset-outline, .object.is-selected .asset-hover { opacity: 0; }
    .object.is-selected .asset-original { opacity: 1; filter: drop-shadow(0 14px 12px rgba(25,25,25,.17)); }
    .thing.is-down { z-index: 30 !important; cursor: grabbing; }
    .object.is-down .asset-outline, .object.is-down .asset-hover { opacity: 0; }
    .object.is-down .asset-original { opacity: 1; filter: drop-shadow(0 12px 10px rgba(25,25,25,.16)); }
    .photo { border: 0; box-shadow: 0 0 0 var(--outer-line) var(--ink), inset 0 0 0 var(--inner-line) var(--inner), 0 5px 5px rgba(25,25,25,.08); background: var(--paper); }
    .photo.is-hovered { background: var(--tone); box-shadow: 0 0 0 var(--outer-line) var(--ink), 0 5px 5px rgba(25,25,25,.08); }
    .photo.is-down, .photo.is-down:hover { background-image: var(--photo); background-size: cover; background-position: center; background-repeat: no-repeat; box-shadow: 0 12px 10px rgba(25,25,25,.16); }
    .photo.is-selected, .photo.is-selected:hover { background-image: var(--photo); background-size: cover; background-position: center; background-repeat: no-repeat; box-shadow: 0 14px 12px rgba(25,25,25,.17); }
    .thing.is-selected { z-index: 80 !important; }
    .thing.focus-transition { transition: transform .46s cubic-bezier(.22,.61,.36,1); }
    .focus-title { position: absolute; left: 0; top: 0; z-index: 81; max-width: 240px; color: #fff; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; pointer-events: none; transform-origin: top left; opacity: 0; animation: reveal-information .32s .1s ease forwards; }
    .focus-title span { display: table; max-width: 100%; padding: 4px 7px 5px; overflow: hidden; background: #171717; white-space: nowrap; text-overflow: ellipsis; }
    .focus-title-main { font-size: 16px; font-weight: 600; line-height: 1.2; letter-spacing: -.02em; }
    .focus-title-time { margin-top: 4px; font-size: 13px; font-weight: 400; line-height: 1.2; }
    .material-symbols-rounded { font-family: "Material Symbols Rounded"; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; word-wrap: normal; direction: ltr; -webkit-font-feature-settings: "liga"; -webkit-font-smoothing: antialiased; font-feature-settings: "liga"; }
    .memory-card { position: absolute; left: 0; top: 0; z-index: 81; width: min(360px, 84vw); color: #171717; opacity: 0; transition: opacity .32s ease; pointer-events: none; transform-origin: top left; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .memory-card.is-visible { opacity: 1; pointer-events: auto; }
    .memory-card.detail-return-copy { opacity: 0 !important; pointer-events: none; }
    .memory-index { margin: 0 0 22px; font-size: 48px; font-weight: 400; line-height: .95; letter-spacing: -.055em; }
    .memory-card p { margin: 0 0 20px; color: #5d626a; font-size: 14px; line-height: 1.62; }
    .memory-actions { display: grid; grid-template-columns: minmax(0,1fr) 52px; gap: 14px; align-items: center; }
    .audio-player, .interview-entry { border: 0; color: #fff; background: linear-gradient(180deg,#555,#3f3f3f); box-shadow: none; cursor: pointer; }
    .audio-player { min-width: 0; height: 50px; display: grid; grid-template-columns: 38px minmax(0,1fr) 72px; align-items: center; gap: 8px; padding: 0 12px 0 8px; border-radius: 17px; }
    .audio-player:active, .interview-entry:active { transform: translateY(2px); box-shadow: none; }
    .audio-toggle { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: rgba(255,255,255,.12); }
    .audio-toggle .material-symbols-rounded { font-size: 27px; }
    .audio-time { color: rgba(255,255,255,.52); font-size: 12px; font-variant-numeric: tabular-nums; text-align: right; }
    .waveform { height: 26px; display: flex; align-items: center; justify-content: space-between; gap: 2px; overflow: hidden; }
    .waveform i { flex: 0 0 2px; height: var(--h); border-radius: 2px; background: rgba(255,255,255,.92); transform-origin: center; }
    .audio-player.is-playing .waveform i { animation: voice-wave .7s ease-in-out infinite alternate; animation-delay: calc(var(--i) * -45ms); }
    .interview-entry { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 50%; padding: 0; }
    .interview-entry .material-symbols-rounded { font-size: 31px; }
    #entry-toast { position: fixed; left: 50%; bottom: 28px; z-index: 120; transform: translate(-50%,12px); padding: 9px 14px; border-radius: 999px; color: #fff; background: rgba(24,24,24,.88); opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease; font: 13px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    #entry-toast.show { opacity: 1; transform: translate(-50%,0); }
    .focus-title.is-closing, .memory-card.is-closing { animation: none; opacity: 0; transition: opacity .2s ease; pointer-events: none; }
    @keyframes reveal-information { from { opacity: 0; } to { opacity: 1; } }
    @keyframes voice-wave { from { transform: scaleY(.5); opacity: .65; } to { transform: scaleY(1); opacity: 1; } }
    #settings-button { position: fixed; top: 18px; right: 18px; width: 42px; height: 42px; z-index: 101; border: 1px solid rgba(20,20,20,.16); border-radius: 50%; background: rgba(244,243,239,.86); backdrop-filter: blur(14px); display: none; place-items: center; padding: 0; cursor: pointer; box-shadow: 0 6px 20px rgba(30,30,30,.08); }
    #settings-button svg { width: 19px; height: 19px; stroke: var(--ink); }
    #settings-button .material-symbols-rounded { font-size: 21px; color: var(--ink); }
    #settings-panel { position: fixed; top: 70px; right: 18px; width: 248px; max-height: calc(100vh - 88px); overflow-y: auto; z-index: 100; padding: 16px; border: 1px solid rgba(20,20,20,.14); border-radius: 16px; background: rgba(244,243,239,.92); backdrop-filter: blur(18px); box-shadow: 0 14px 38px rgba(30,30,30,.12); opacity: 0; transform: translateY(-8px) scale(.98); transform-origin: top right; pointer-events: none; transition: opacity .16s ease, transform .16s ease; display:none; }
    #settings-panel.open { opacity: 1; transform: none; pointer-events: auto; }
    .control { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px 12px; margin-bottom: 15px; font: 12px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #333; }
    .control:last-child { margin-bottom: 0; }
    .control output { color: #777; font-variant-numeric: tabular-nums; }
    .control input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: #1d1d1d; }
    .control input[type="color"] { width: 28px; height: 22px; padding: 0; border: 0; border-radius: 6px; background: transparent; overflow: hidden; cursor: pointer; }
  </style>
</head>
<body>

  <div id="entry-toast" role="status">录音 / AI 语音采访入口</div>
  <aside id="settings-panel" aria-hidden="true">

    <label class="control"><span>内描边宽度</span><output id="inner-value">4px</output><input id="inner-width" type="range" min="0" max="16" step="1" value="4"></label>
    <label class="control"><span>外描边颜色</span><input id="outer-color" type="color" value="#171717" aria-label="外描边颜色"></label>

    <label class="control"><span>排斥半径</span><output id="repulsion-value">10px</output><input id="repulsion-radius" type="range" min="0" max="120" step="2" value="10"></label>
    <label class="control"><span>视角大小</span><output id="zoom-value">100%</output><input id="view-zoom" type="range" min="40" max="180" step="5" value="100"></label>
    <label class="control"><span>物品大小</span><output id="size-value">150%</output><input id="item-size" type="range" min="50" max="160" step="5" value="150"></label>
  </aside>
  <script src="assets/objects/manifest.js"></script>
  <script>
    const scene = document.querySelector('#scene');
    const homeTopPanel = document.querySelector('#home-top-panel');
    const sharePullOverlay = document.querySelector('#share-pull-overlay');
    const themeColorMeta = document.querySelector('meta[name="theme-color"]');
    const root = document.documentElement;
    const settingsButton = document.querySelector('#settings-button');
    const settingsPanel = document.querySelector('#settings-panel');
    const entryToast = document.querySelector('#entry-toast');
    const TAU = Math.PI * 2;
    const camera = { x: 0, y: 0, zoom: 1, dragging: false, lastX: 0, lastY: 0 };
    let repulsionGap = 10;
    let itemScale = 1.5;
    let outlineOuter = 2;
    let outlineInner = 4;
    let outlineInk = '#171717';
    let outlineGray = '#9a9a96';
    let outlineRenderToken = 0;
    let outlineRenderTimer = 0;
    let awakeUntil = 0;
    let gatherBoostUntil = 0;
    let toastTimer = 0;
    let focusTransitionTimer = 0;
    const objectAssets = window.OBJECT_ASSETS || [];
    const tones = ['#c59b72','#c47c68','#a9a06a','#a8889d','#82a49a','#b66e5c','#91a5b3','#c39a58','#a98272'];
    const photos = [
      {src:'assets/photos/family.webp',ratio:3/2},{src:'assets/photos/street.webp',ratio:4/3},
      {src:'assets/photos/school.webp',ratio:2/3},{src:'assets/photos/seaside.webp',ratio:3/2},
      {src:'assets/photos/birthday.webp',ratio:4/3},{src:'assets/photos/dog.webp',ratio:1},
      {src:'assets/photos/train.webp',ratio:2/3},{src:'assets/photos/house.webp',ratio:4/3},
      {src:'assets/photos/park.webp',ratio:3/2}
    ];
    const objectMemories = [
      ['旧钥匙','外婆总把它放在玄关的小瓷碟里。后来门锁换了，它却一直没有被丢掉。'],
      ['搪瓷杯','小时候每次回家，桌上都会有一杯温水。杯沿的缺口，到现在还记得。'],
      ['旧磁带','A 面是父亲喜欢的歌，B 面录进了我们说话和笑闹的声音。'],
      ['胶片相机','很多照片已经褪色，但按下快门前大家靠近彼此的样子仍然清晰。'],
      ['木梳','早晨坐在窗边，奶奶一边梳头，一边讲那些重复过很多次的故事。'],
      ['打火机','它很少被真正点燃，却总被父亲握在手里反复开合。'],
      ['旧汤匙','边缘已经磨得发亮，是家里那只陪了我们很多年的小汤匙。'],
      ['铁皮机器人','小时候以为它能一直走下去，直到发条慢慢停在客厅中央。'],
      ['秋天的叶子','夹在书页里的叶子已经失去颜色，但那次散步还留在记忆里。']
    ];
    const objectTimes = ['1986年','1992年冬天','1998年夏天','2001年','20世纪70年代末','1995年','1989年','2003年','2011年秋天'];
    const photoMemories = [
      ['1998 · 家里的客厅','一家人难得都坐进同一个画面。快门落下以后，狗先跑出了镜头。'],
      ['2001 · 老街','放学后总要绕一点远路，从这条街慢慢走回家。'],
      ['2004 · 毕业那天','校服、操场和没有说出口的告别，都留在这张照片里。'],
      ['2007 · 海边','第一次看到海，我们站在风里，谁也不愿意先回去。'],
      ['2010 · 生日','蜡烛吹灭前，大家催着我快点许愿。'],
      ['2012 · 小狗','它总在门口等我们回家，好像从来不知道什么叫迟到。'],
      ['2015 · 绿皮火车','窗外的景色慢慢向后退，那是第一次独自去很远的地方。'],
      ['2018 · 旧房子','搬家前拍下最后一张照片，门框上还留着量身高的刻度。'],
      ['2020 · 公园','一个普通的下午，因为有人记得按下快门，后来变得很珍贵。']
    ];
    [...objectAssets.flatMap(asset=>[asset.original,asset.outline,asset.hover]),...photos.map(photo=>photo.src)].forEach(src=>{
      const image=new Image();image.decoding='async';image.src=src;
    });
    const items = [];
    const center = { x: .5, y: .48 };
    const HOME_PANEL_HEIGHT = Math.min(100, Math.max(78, innerHeight * .105));
    let homePanelWorldY = 0;
    let panelPullStartY = 0;
    let panelPullDistance = 0;
    let panelPullPointer = null;
    let panelTouchStartY = null;
    let scenePullPointer = null;
    let scenePullStartY = 0;
    function syncGatherTheme() {
      const experienceView=document.body.dataset.experienceView||'home';
      let color='#ffffff';
      if(experienceView==='home'&&document.body.classList.contains('home-top-visible'))color='#111111';
      else if(experienceView==='capture')color='#090909';
      themeColorMeta?.setAttribute('content',color);
    }
    window.setGatherExperienceTheme=view=>{
      document.body.dataset.experienceView=view;
      syncGatherTheme();
    };
    function decodeMask(value) {
      const binary=atob(value),bytes=new Uint8Array(binary.length);
      for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
      return bytes;
    }
    function addThing(type, i) {
      const el = document.createElement('div');
      el.className = `thing ${type}`;
      let w,h,hull,hitMask=null;
      if (type === 'object') {
        const asset=objectAssets[i];
        el.style.setProperty('--tone', asset.tone);
        el.innerHTML = `<img class="asset-state asset-outline" src="${asset.outline}" alt=""><img class="asset-state asset-hover" src="${asset.hover}" alt=""><img class="asset-state asset-original" src="${asset.original}" alt="">`;
        w=170;h=170;hull=asset.hull.map(([x,y])=>({x,y}));hitMask=decodeMask(asset.hitMask);
      } else {
        const asset=photos[i],area=19000;
        w=Math.sqrt(area*asset.ratio);h=w/asset.ratio;
        el.style.setProperty('--photo', `url('${asset.src}')`);
        el.style.setProperty('--tone', tones[(i + 3) % tones.length]);
        hull=[{x:0,y:0},{x:1,y:0},{x:1,y:1},{x:0,y:1}];
      }
      scene.appendChild(el);
      const memory=(type==='object'?objectMemories:photoMemories)[i];
      const item={ el, type, sourceIndex:i, order:items.length+1, x:0,y:0,vx:0,vy:0,angle:(Math.random()-.5)*26,baseW:w,baseH:h,w,h,drag:false,px:0,py:0,hull,hitMask,z:i,memory,
        previewSrc:type==='object'?objectAssets[i].original:photos[i].src,
        originalSrc:type==='object'?new URL(objectAssets[i].original,document.baseURI).href:null,tone:type==='object'?objectAssets[i].tone:null,outlineUrl:null,hoverUrl:null };
      items.push(item);
      return item;
    }
    for (let i=0;i<objectAssets.length;i++) if(objectAssets[i].name!=='comb') addThing('object', i);
    for (let i=0;i<9;i++) if(i!==7) addThing('photo', i);
    function render(a) {
      const screenX=(a.x+a.w/2)*camera.zoom+camera.x-a.w/2;
      const screenY=(a.y+a.h/2)*camera.zoom+camera.y-a.h/2;
      a.el.style.transform = `translate3d(${screenX}px,${screenY}px,0) rotate(${a.angle}deg) scale(${camera.zoom})`;
    }
    function renderHomePanel() {
      const y=homePanelWorldY*camera.zoom+camera.y;
      homeTopPanel.style.height=`${HOME_PANEL_HEIGHT}px`;
      homeTopPanel.style.transform=`translate3d(0,${y}px,0)`;
      const visible=y+HOME_PANEL_HEIGHT>18;
      const fullyVisible=y>=-1;
      document.body.classList.toggle('home-top-visible',visible);
      homeTopPanel.classList.toggle('is-ready',fullyVisible);
      syncGatherTheme();
    }
    function renderAll() { items.forEach(render); renderFocusUI(); renderHomePanel(); }
    function setSize(a, scale) {
      a.w = a.baseW * scale;
      a.h = a.baseH * scale;
      a.el.style.width = `${a.w}px`;
      a.el.style.height = `${a.h}px`;
    }
    function applyOutlineMetrics() {
      root.style.setProperty('--outer-line', `${outlineOuter*itemScale}px`);
      root.style.setProperty('--inner-line', `${outlineInner*itemScale}px`);
      root.style.setProperty('--ink', outlineInk);
      root.style.setProperty('--inner', outlineGray);
    }
    function hexRgb(hex) {
      const value=hex.replace('#','');
      return [parseInt(value.slice(0,2),16),parseInt(value.slice(2,4),16),parseInt(value.slice(4,6),16)];
    }
    function morphMask(mask, width, height, radius, erode=false) {
      if(radius<=0)return mask.slice();
      const stride=width+1, integral=new Uint32Array((width+1)*(height+1));
      for(let y=0;y<height;y++){
        let row=0;
        for(let x=0;x<width;x++){
          row+=mask[y*width+x];
          integral[(y+1)*stride+x+1]=integral[y*stride+x+1]+row;
        }
      }
      const result=new Uint8Array(mask.length), full=(radius*2+1)**2;
      for(let y=0;y<height;y++)for(let x=0;x<width;x++){
        const x0=Math.max(0,x-radius),y0=Math.max(0,y-radius),x1=Math.min(width-1,x+radius),y1=Math.min(height-1,y+radius);
        const sum=integral[(y1+1)*stride+x1+1]-integral[y0*stride+x1+1]-integral[(y1+1)*stride+x0]+integral[y0*stride+x0];
        result[y*width+x]=erode ? Number(sum===full) : Number(sum>0);
      }
      return result;
    }
    function paintObjectState(mask, expanded, core, size, fill, hovered=false) {
      const canvas=document.createElement('canvas');canvas.width=size;canvas.height=size;
      const ctx=canvas.getContext('2d'), pixels=ctx.createImageData(size,size);
      const ink=hexRgb(outlineInk), inner=hexRgb(outlineGray), tone=hexRgb(fill);
      for(let i=0;i<mask.length;i++){
        if(!expanded[i])continue;
        const p=i*4;
        let color=ink;
        if(mask[i])color=hovered ? tone : (core[i] ? [255,255,255] : inner);
        pixels.data[p]=color[0];pixels.data[p+1]=color[1];pixels.data[p+2]=color[2];pixels.data[p+3]=255;
      }
      ctx.putImageData(pixels,0,0);
      return canvas.toDataURL('image/png');
    }
    async function buildObjectStates(a) {
      const size=512, image=new Image();image.decoding='async';image.src=a.originalSrc;
      if(image.decode)await image.decode();else await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;});
      const canvas=document.createElement('canvas');canvas.width=size;canvas.height=size;
      const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(image,0,0,size,size);
      const source=ctx.getImageData(0,0,size,size).data, mask=new Uint8Array(size*size);
      for(let i=0;i<mask.length;i++)mask[i]=Number(source[i*4+3]>8);
      const outerRadius=Math.round(outlineOuter*size/a.baseW);
      const innerRadius=Math.round(outlineInner*size/a.baseW);
      const expanded=morphMask(mask,size,size,outerRadius);
      const core=morphMask(mask,size,size,innerRadius,true);
      return {
        outline:paintObjectState(mask,expanded,core,size,a.tone,false),
        hover:paintObjectState(mask,expanded,core,size,a.tone,true)
      };
    }
    function scheduleObjectOutlines() {
      clearTimeout(outlineRenderTimer);
      const token=++outlineRenderToken;
      outlineRenderTimer=setTimeout(async()=>{
        const objects=items.filter(a=>a.type==='object');
        try{
          const states=await Promise.all(objects.map(buildObjectStates));
          if(token!==outlineRenderToken)return;
          objects.forEach((a,i)=>{

        const damping=Math.pow(.92,dt);
        items.forEach(a=>{if(!a.drag){a.vx*=damping;a.vy*=damping;if(Math.hypot(a.vx,a.vy)<.015){a.vx=0;a.vy=0;}}});
        renderAll();
      }
      requestAnimationFrame(physicsFrame);
    }
    let activeItem=null;
    let hoveredItem=null;
    let zCounter=items.length;
    let pressStartX=0,pressStartY=0,dragStarted=false;
    function localPoint(a, clientX, clientY) {
      const worldX=(clientX-camera.x)/camera.zoom;
      const worldY=(clientY-camera.y)/camera.zoom;
      const cx=a.x+a.w/2, cy=a.y+a.h/2;
      const dx=worldX-cx, dy=worldY-cy;
      const angle=-a.angle*Math.PI/180, cos=Math.cos(angle), sin=Math.sin(angle);
      return {x:dx*cos-dy*sin+a.w/2,y:dx*sin+dy*cos+a.h/2};
    }
    function containsPoint(a, clientX, clientY) {
      const point=localPoint(a,clientX,clientY);
      if(point.x<0||point.y<0||point.x>=a.w||point.y>=a.h)return false;
      if(a.type==='photo')return true;
      const maskSize=64;
      const mx=Math.min(maskSize-1,Math.floor(point.x/a.w*maskSize));
      const my=Math.min(maskSize-1,Math.floor(point.y/a.h*maskSize));
      const bit=my*maskSize+mx;
      return Boolean(a.hitMask[bit>>3]&(1<<(7-(bit&7))));
    }
    function hitItemAt(clientX, clientY) {
      const ordered=[...items].sort((a,b)=>b.z-a.z);
      return ordered.find(a=>containsPoint(a,clientX,clientY))||null;
    }
    function setHovered(next) {
      if(hoveredItem===next)return;
      if(hoveredItem)hoveredItem.el.classList.remove('is-hovered');
      hoveredItem=next;
      if(hoveredItem&&!hoveredItem.drag)hoveredItem.el.classList.add('is-hovered');
      scene.style.cursor=hoveredItem?'pointer':'grab';
    }
    scene.addEventListener('pointerdown', e => {
      if(e.button!==undefined&&e.button!==0)return;
      const hit=hitItemAt(e.clientX,e.clientY);
      scene.setPointerCapture(e.pointerId);
      if(hit){
        activeItem=hit;dragStarted=false;pressStartX=e.clientX;pressStartY=e.clientY;
        hit.vx=0;hit.vy=0;hit.px=e.clientX;hit.py=e.clientY;
      }else{
        camera.dragging=true;camera.lastX=e.clientX;camera.lastY=e.clientY;scene.classList.add('panning');
      }
    });
    scene.addEventListener('pointermove', e => {
      if(scenePullPointer===e.pointerId){
        setPullProgress(e.clientY-scenePullStartY);
      }else if(activeItem){
        const a=activeItem;
        const totalX=e.clientX-pressStartX,totalY=e.clientY-pressStartY;
        if(!dragStarted&&homeTopPanel.classList.contains('is-ready')&&totalY>10&&totalY>Math.abs(totalX)*1.15){
          activeItem=null;
          scenePullPointer=e.pointerId;
          scenePullStartY=pressStartY;
          setHovered(null);
          setPullProgress(totalY);
          return;
        }
        if(!dragStarted&&Math.hypot(e.clientX-pressStartX,e.clientY-pressStartY)>=7){
          dragStarted=true;a.drag=true;a.z=++zCounter;a.el.style.zIndex=a.z;setHovered(null);a.el.classList.add('is-down');wake(900);
        }
        if(!dragStarted)return;
        const dx=(e.clientX-a.px)/camera.zoom,dy=(e.clientY-a.py)/camera.zoom;
        const steps=Math.max(1,Math.ceil(Math.hypot(dx,dy)/8));
        for(let step=0;step<steps;step++){a.x+=dx/steps;a.y+=dy/steps;resolveCollisions(a,4);}
        a.vx=a.vx*.35+dx*.65;a.vy=a.vy*.35+dy*.65;a.px=e.clientX;a.py=e.clientY;wake(900);
      }else if(camera.dragging){
        const deltaY=e.clientY-camera.lastY;
        if(homeTopPanel.classList.contains('is-ready')&&deltaY>0){
          camera.dragging=false;scene.classList.remove('panning');
          scenePullPointer=e.pointerId;scenePullStartY=camera.lastY;
          setPullProgress(deltaY);
          return;
        }
        camera.y+=deltaY;
        camera.lastX=e.clientX;camera.lastY=e.clientY;clampCameraY();renderAll();
      }else if(e.pointerType!=='touch')setHovered(hitItemAt(e.clientX,e.clientY));
    });
    function releasePointer(e) {
      if(scenePullPointer===e.pointerId){
        scenePullPointer=null;
        if(e.type!=='pointercancel'&&panelPullDistance>=88)commitSharePull();
        else resetSharePull();
        try{scene.releasePointerCapture(e.pointerId);}catch{}
        return;
      }
      if(activeItem){
        const a=activeItem;
        if(dragStarted){
          resolveCollisions(a,12);a.drag=false;a.el.classList.remove('is-down');
          if(selectedItem){pushAwayFromFocus(10);}else wake(1800);
        }else if(e.type!=='pointercancel'){
          selectItem(a);
        }
        activeItem=null;dragStarted=false;
      }
      if(camera.dragging){camera.dragging=false;scene.classList.remove('panning');}
      try{scene.releasePointerCapture(e.pointerId);}catch{}
      if(e.type!=='pointercancel'&&e.pointerType!=='touch')setHovered(hitItemAt(e.clientX,e.clientY));else setHovered(null);
    }
    scene.addEventListener('pointerup',releasePointer);
    scene.addEventListener('pointercancel',releasePointer);
    scene.addEventListener('pointerleave',()=>{if(!activeItem&&!camera.dragging)setHovered(null);});
    let desktopPullTimer=0;
    let sharePullCommitting=false;
    function resetSharePull(){
      panelPullDistance=0;
      sharePullOverlay.style.opacity='0';
      homeTopPanel.style.removeProperty('--pull');
      homeTopPanel.style.removeProperty('background');
      homeTopPanel.style.removeProperty('opacity');
      setTimeout(()=>sharePullOverlay.classList.remove('is-active'),220);
    }
    function commitSharePull() {
      if(sharePullCommitting)return;
      sharePullCommitting=true;
      clearTimeout(desktopPullTimer);
      sharePullOverlay.classList.add('is-active','is-committing');
      sharePullOverlay.style.opacity='1';
      setTimeout(()=>{
        window.GatherExperience?.openShareGame?.({fromPull:true});
        setTimeout(()=>{sharePullOverlay.classList.remove('is-active','is-committing');sharePullOverlay.style.opacity='0';homeTopPanel.style.removeProperty('--pull');homeTopPanel.style.removeProperty('background');homeTopPanel.style.removeProperty('opacity');panelPullDistance=0;sharePullCommitting=false;},260);
      },180);
    }
    scene.addEventListener('wheel', e => {
      e.preventDefault();
      if(homeTopPanel.classList.contains('is-ready')&&e.deltaY<0){
        clearTimeout(desktopPullTimer);
        setPullProgress(panelPullDistance+Math.min(42,-e.deltaY*.5));
        if(panelPullDistance>=88){commitSharePull();return;}
        desktopPullTimer=setTimeout(resetSharePull,180);
        return;
      }
      camera.y-=e.deltaY;
      clampCameraY();
      renderAll();
    }, {passive:false});

    function setPullProgress(distance) {
      panelPullDistance=Math.max(0,Math.min(150,distance));
      const progress=Math.min(1,panelPullDistance/105);
      homeTopPanel.style.setProperty('--pull',`${panelPullDistance*.34}px`);
      homeTopPanel.style.opacity=String(1-progress);
      sharePullOverlay.style.opacity=String(progress);
      sharePullOverlay.classList.toggle('is-active',progress>0);
    }
    homeTopPanel.addEventListener('pointerdown',event=>{
      if(event.button!==undefined&&event.button!==0)return;
      if(!homeTopPanel.classList.contains('is-ready'))return;
      panelPullPointer=event.pointerId;panelPullStartY=event.clientY;setPullProgress(0);
      homeTopPanel.setPointerCapture(event.pointerId);
    });
    homeTopPanel.addEventListener('pointermove',event=>{
      if(panelPullPointer!==event.pointerId)return;
      setPullProgress(event.clientY-panelPullStartY);
    });
    function finishPanelPull(event) {
      if(panelPullPointer!==event.pointerId)return;
      const shouldOpen=panelPullDistance>=88;
      panelPullPointer=null;
      try{homeTopPanel.releasePointerCapture(event.pointerId);}catch{}
      if(shouldOpen){
        commitSharePull();
      }else{
        resetSharePull();
      }
    }
    homeTopPanel.addEventListener('pointerup',finishPanelPull);
    homeTopPanel.addEventListener('pointercancel',finishPanelPull);
    // Some mobile simulators dispatch Touch Events without a usable Pointer Event stream.
    homeTopPanel.addEventListener('touchstart',event=>{
      if(!homeTopPanel.classList.contains('is-ready'))return;
      panelTouchStartY=event.touches[0]?.clientY??null;
      if(panelTouchStartY!==null)setPullProgress(0);
    },{passive:true});
    homeTopPanel.addEventListener('touchmove',event=>{
      if(panelTouchStartY===null)return;
      const distance=(event.touches[0]?.clientY??panelTouchStartY)-panelTouchStartY;
      if(distance<=0)return;
      if(event.cancelable)event.preventDefault();
      setPullProgress(distance);
    },{passive:false});
    function finishTouchPanelPull(event){
      if(panelTouchStartY===null)return;
      panelTouchStartY=null;
      if(panelPullDistance>=88){commitSharePull();return;}
      resetSharePull();
    }
    homeTopPanel.addEventListener('touchend',finishTouchPanelPull,{passive:true});
    homeTopPanel.addEventListener('touchcancel',finishTouchPanelPull,{passive:true});

    settingsButton.addEventListener('click', () => {
      const open = settingsPanel.classList.toggle('open');
      settingsButton.setAttribute('aria-expanded', String(open));
      settingsPanel.setAttribute('aria-hidden', String(!open));
    });
    function bindRange(id, outputId, apply, format=value=>`${value}px`) {
      const input=document.querySelector(`#${id}`), output=document.querySelector(`#${outputId}`);
      input.addEventListener('input', () => { output.value=format(input.value); apply(Number(input.value)); });
    }
    bindRange('outer-width','outer-value', value => {
      outlineOuter=value; applyOutlineMetrics(); scheduleObjectOutlines(); resolveCollisions(null,16); wake(2800);
    });
    bindRange('inner-width','inner-value', value => {
      outlineInner=value; applyOutlineMetrics(); scheduleObjectOutlines();
    });
    document.querySelector('#outer-color').addEventListener('input', event => {
      outlineInk=event.target.value; applyOutlineMetrics(); scheduleObjectOutlines();
    });
    document.querySelector('#inner-color').addEventListener('input', event => {
      outlineGray=event.target.value; applyOutlineMetrics(); scheduleObjectOutlines();
    });
    bindRange('repulsion-radius','repulsion-value', value => { repulsionGap=value; resolveCollisions(null,16); wake(4200); });
    bindRange('view-zoom','zoom-value', value => {
      const next=value/100, sx=innerWidth/2, sy=innerHeight/2;
      const wx=(sx-camera.x)/camera.zoom, wy=(sy-camera.y)/camera.zoom;
      camera.zoom=next; camera.x=sx-wx*next; camera.y=sy-wy*next; renderAll();
      items.forEach(a=>constrainHorizontal(a));clampCameraY();renderAll();
    }, value=>`${value}%`);
    bindRange('item-size','size-value', value => {
      itemScale=value/100;
      items.forEach(a=>{const cx=a.x+a.w/2, cy=a.y+a.h/2;setSize(a,itemScale);a.x=cx-a.w/2;a.y=cy-a.h/2;});
      applyOutlineMetrics(); resolveCollisions(null,16); wake(3200); renderAll();
    }, value=>`${value}%`);
    function addCapturedItem(type,sourceIndex) {
      const existing=items.find(a=>a.type===type&&a.sourceIndex===sourceIndex);
      if(existing)return existing;
      const a=addThing(type,sourceIndex);
      setSize(a,itemScale);
      a.x=(-camera.x+innerWidth*.5)/camera.zoom-a.w/2;
      a.y=(-camera.y+innerHeight*.58)/camera.zoom-a.h/2;
      a.angle=(Math.random()-.5)*18;
      a.z=++zCounter;a.el.style.zIndex=a.z;
      constrainHorizontal(a,false);
      resolveCollisions(a,18,false);
      if(type==='object')scheduleObjectOutlines();
      wake(2600);renderAll();
      return a;
    }
    function updateItemMemory(a,summary) {
      if(!a||!summary)return;
      a.memory[1]=summary;
      a.memoryCard?.querySelector('p')?.replaceChildren(document.createTextNode(summary));
    }
    function returnFromDetail(a,point) {
      if(!a)return;
      clearTimeout(selectionSwitchTimer);pendingSelection=null;
      clearSelection({animate:false,wakeItems:false,collapseZone:false,preserveItem:a});
      returnPinned=a;a.vx=0;a.vy=0;a.angle=0;
      a.x=(point.x-camera.x)/camera.zoom-a.w/2;
      a.y=(point.y-camera.y)/camera.zoom-a.h/2;
      constrainHorizontal(a,false);render(a);
      activateSelection(a);
      a.memoryCard?.classList.add('detail-return-copy');
      items.forEach(item=>{
        if(item===a)return;
        item.el.classList.add('detail-return-fade','detail-return-hidden');
      });
      requestAnimationFrame(()=>requestAnimationFrame(()=>items.forEach(item=>item.el.classList.remove('detail-return-hidden'))));
      setTimeout(()=>{
        a.memoryCard?.classList.remove('detail-return-copy');
        items.forEach(item=>item.el.classList.remove('detail-return-fade','detail-return-hidden'));
        returnPinned=null;
        gatherBoostUntil=performance.now()+900;wake(1500);
      },560);
    }
    window.GatherHome={
      addCaptured:addCapturedItem,
      updateMemory:updateItemMemory,
      returnFromDetail,
      getShareItems:()=>items.map(a=>({title:memoryMeta(a).title,time:memoryMeta(a).time,summary:a.memory[1],src:a.previewSrc,type:a.type,order:a.order})),
      closeFocus:()=>clearSelection(),
      hasItem:(type,sourceIndex)=>items.some(a=>a.type===type&&a.sourceIndex===sourceIndex)
    };
    applyOutlineMetrics();
    scheduleObjectOutlines();
    packedLayout();
    items.forEach(a=>constrainHorizontal(a));
    clampCameraY();
    camera.y=-homePanelWorldY*camera.zoom;
    renderAll();
    window.addEventListener('resize',()=>{
      camera.x=innerWidth*(1-camera.zoom)/2;
      items.forEach(a=>constrainHorizontal(a));clampCameraY();renderAll();
    });
    requestAnimationFrame(physicsFrame);
  </script>
